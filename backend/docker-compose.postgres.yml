services:
  postgres:
    image: postgres:16-alpine
    container_name: rca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rca
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca -d rca"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
